<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lokii's — Supplement Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0A0806;
    --ink:#F3F6FF;
    --ink-soft:rgba(243,246,255,0.6);
    --gold:#F0C25E;
    --gold-dark:#C99A2E;
    --sage:#D9A441;
    --sage-dark:#8C6A1E;
    --danger:#FF7A66;
    --glass-bg:linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.025));
    --glass-bg-strong:linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    --glass-border:rgba(255,255,255,0.16);
    --glass-shadow:0 10px 34px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-deep);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding: 32px 20px 80px;
    position:relative;
    overflow-x:hidden;
  }
  /* Ambient glossy background blobs */
  body::before, body::after{
    content:"";
    position:fixed;
    width: 480px; height: 480px;
    border-radius:50%;
    filter: blur(90px);
    z-index:-1;
    opacity:0.55;
  }
  body::before{
    background: radial-gradient(circle, rgba(240,194,94,0.5), transparent 70%);
    top: -180px; left: -140px;
  }
  body::after{
    background: radial-gradient(circle, rgba(140,106,30,0.55), transparent 70%);
    bottom: -200px; right: -160px;
  }
  .wrap{ max-width: 720px; margin: 0 auto; position:relative; z-index:1; }

  /* Glass base */
  .glass{
    background: var(--glass-bg);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    box-shadow: var(--glass-shadow);
    position: relative;
    overflow:hidden;
  }
  .glass::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent 45%);
    pointer-events:none;
  }

  /* Header */
  header{
    padding: 26px 26px 22px;
  }
  header, header.glass{ border-radius: 26px; }
  .logo-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom: 16px;
    position:relative; z-index:1;
  }
  .logo-mark{
    width: 50px;
    height: 50px;
    flex-shrink:0;
    border-radius: 15px;
    background: linear-gradient(155deg, rgba(255,255,255,0.22), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    padding: 8px;
  }
  .logo-mark svg{ width:100%; height:100%; display:block; }
  .logo-text{ display:flex; flex-direction:column; }
  .eyebrow{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom:3px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    background: linear-gradient(180deg, #FFFDF6, #E8C158);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .date-row{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
    margin-top: 16px;
    position:relative; z-index:1;
  }
  #today-date{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .streak-badge{
    font-size: 13px;
    font-weight: 600;
    background: linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0.06));
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 3px 10px rgba(0,0,0,0.3);
    color: var(--ink);
    padding: 6px 14px;
    border-radius: 100px;
    display:flex; align-items:center; gap:6px;
  }
  .streak-badge .flame{ font-size: 12px; color: var(--gold); }

  /* Progress gauge */
  .gauge-row{
    margin-top: 20px;
    position:relative; z-index:1;
  }
  .gauge-track{
    height: 12px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px;
    overflow:hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }
  .gauge-fill{
    height:100%;
    background: linear-gradient(180deg, #F7DDA0, var(--gold-dark));
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.5);
    border-radius:100px;
    width:0%;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .gauge-label{
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-top: 8px;
    display:flex; justify-content:space-between;
  }

  /* Section titles */
  .section-title{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin: 30px 4px 12px;
    display:flex; align-items:center; gap:10px;
  }

  /* Time-of-day groups */
  .time-group{ margin-bottom: 6px; }
  .time-group-label{
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    margin: 18px 0 8px 6px;
    letter-spacing: 0.02em;
  }

  /* Supplement card */
  .supp-card{
    padding: 12px 14px;
    margin-bottom: 10px;
    display:flex;
    align-items:center;
    gap:14px;
    transition: opacity 0.3s, transform 0.15s;
  }
  .supp-card:active{ transform: scale(0.985); }
  .supp-card.taken{ opacity: 0.6; }

  /* iOS-style switch */
  .capsule-toggle{
    flex-shrink:0;
    cursor:pointer;
    user-select:none;
  }
  .capsule{
    width: 48px; height: 28px;
    border-radius: 999px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.35);
    position:relative;
    transition: background 0.3s, border-color 0.3s;
  }
  .capsule::after{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:22px; height:22px;
    border-radius:50%;
    background: linear-gradient(180deg, #ffffff, #e9e9e9);
    box-shadow: 0 2px 5px rgba(0,0,0,0.4), 0 0 0 0.5px rgba(0,0,0,0.05);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .supp-card.taken .capsule{
    background: linear-gradient(180deg, #F7DDA0, var(--gold-dark));
    border-color: transparent;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
  }
  .supp-card.taken .capsule::after{ transform: translateX(20px); }

  .supp-info{
    flex:1;
    display:flex; flex-direction:column; justify-content:center; gap:2px;
    min-width:0;
  }
  .supp-name{
    font-weight: 600;
    font-size: 16px;
  }
  .supp-meta{
    font-size: 12px;
    color: var(--ink-soft);
  }
  .supp-actions{
    display:flex; align-items:center;
  }
  .icon-btn{
    border:none; cursor:pointer;
    color: var(--ink-soft);
    font-size: 15px;
    width: 32px; height:32px;
    line-height:1;
    border-radius:50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    transition: background 0.2s;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.16); color: var(--ink); }

  .empty-state{
    font-size: 13px;
    color: var(--ink-soft);
    padding: 26px 4px;
    text-align:center;
    border-radius: 18px;
  }

  /* Add button */
  .add-bar{
    margin-top: 24px;
  }
  .add-btn{
    width:100%;
    font-size: 15px;
    font-weight: 600;
    background: linear-gradient(180deg, #F3D583, var(--gold-dark));
    color: #2A2007;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 6px 18px rgba(232,193,88,0.35), inset 0 1px 0 rgba(255,255,255,0.6);
    border-radius: 999px;
    padding: 15px;
    cursor:pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .add-btn:hover{ box-shadow: 0 8px 22px rgba(232,193,88,0.45), inset 0 1px 0 rgba(255,255,255,0.6); }
  .add-btn:active{ transform: scale(0.98); }

  /* History heatmap */
  .heatmap{
    display:grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 6px;
    padding: 18px;
  }
  .heat-cell{
    aspect-ratio: 1;
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
    position:relative;
    cursor:pointer;
    transition: transform 0.15s;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.08);
  }
  .heat-cell:hover{ transform: scale(1.2); }
  .heat-cell[data-level="1"]{ background: linear-gradient(180deg, #6B5324, #4A3A18); }
  .heat-cell[data-level="2"]{ background: linear-gradient(180deg, #9C7A2E, #6B5324); }
  .heat-cell[data-level="3"]{ background: linear-gradient(180deg, #F0D488, var(--gold)); }
  .heat-cell[data-level="4"]{ background: linear-gradient(180deg, #F7DDA0, var(--gold-dark)); }
  .heat-cell.today{ box-shadow: 0 0 0 1.5px var(--ink); }
  .heat-legend{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--ink-soft);
    margin: 10px 4px 0; justify-content:flex-end;
  }
  .heat-legend .heat-cell{ width:10px; height:10px; aspect-ratio:unset; cursor:default; }
  .heat-legend .heat-cell:hover{ transform:none; }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(4,10,7,0.6);
    backdrop-filter: blur(4px);
    display:none;
    align-items:center; justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background: linear-gradient(180deg, rgba(30,48,38,0.92), rgba(18,32,24,0.96));
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border-radius: 26px;
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.18);
    padding: 26px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y:auto;
  }
  .modal h2{
    font-family:'Fraunces', serif;
    font-size: 21px;
    margin: 0 0 18px;
  }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color: var(--ink-soft);
    margin-bottom:7px;
  }
  .field input, .field select{
    width:100%;
    font-family: inherit;
    font-size: 15px;
    padding: 11px 13px;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 13px;
    background: rgba(255,255,255,0.07);
    color: var(--ink);
  }
  .field input::placeholder{ color: rgba(245,241,230,0.35); }
  .field input:focus, .field select:focus{
    outline: 2px solid var(--sage);
    outline-offset: 1px;
    background: rgba(255,255,255,0.1);
  }
  .modal-actions{
    display:flex; gap:10px; margin-top: 20px;
  }
  .btn{
    flex:1;
    font-size: 14px;
    font-weight: 600;
    padding: 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.08);
    color: var(--ink);
    cursor:pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .btn:active{ transform: scale(0.97); }
  .btn.primary{
    background: linear-gradient(180deg, #F3D583, var(--gold-dark));
    color: #2A2007;
    border-color: rgba(255,255,255,0.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .btn.danger{
    background: rgba(255,122,102,0.12);
    color: var(--danger);
    border-color: rgba(255,122,102,0.4);
  }

  .day-item{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 14px;
  }
  .day-item:last-child{ border-bottom:none; }
  .day-item .di-name{ font-weight:600; }
  .day-item .di-meta{
    font-size: 11.5px;
    color: var(--ink-soft);
    display:block;
    margin-top:2px;
  }
  .day-item .status{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 5px 11px;
    border-radius: 100px;
    white-space:nowrap;
  }
  .day-item.taken .status{ background: rgba(123,196,154,0.2); color: var(--sage); }
  .day-item.missed .status{ background: rgba(255,255,255,0.08); color: var(--ink-soft); }

  footer{
    text-align:center;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 36px;
    opacity:0.7;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }

  @media (max-width: 480px){
    h1{ font-size: 25px; }
    .heatmap{ grid-template-columns: repeat(10, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <div class="logo-row">
      <div class="logo-mark">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="none" stroke="#F0C25E" stroke-width="2"/>
          <circle cx="50" cy="50" r="42" fill="none" stroke="#8C6A1E" stroke-width="1" opacity="0.7"/>
          <path d="M32 62 Q32 40 50 38 Q68 40 68 62" fill="none" stroke="#F0C25E" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M28 62 L72 62 Q72 74 50 76 Q28 74 28 62 Z" fill="#F0C25E"/>
          <line x1="50" y1="24" x2="50" y2="38" stroke="#F0C25E" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M40 26 Q50 20 60 26" fill="none" stroke="#F0C25E" stroke-width="2" stroke-linecap="round"/>
          <circle cx="38" cy="47" r="2.2" fill="#0A0806"/>
          <circle cx="62" cy="47" r="2.2" fill="#0A0806"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="eyebrow" style="margin-bottom:2px;">Compounded Daily &middot; No. 01</div>
        <h1 style="font-size:26px;">Lokii's Supplement Dose</h1>
      </div>
    </div>
    <div class="date-row">
      <div id="today-date"></div>
      <div class="streak-badge"><span class="flame">&#9679;</span><span id="streak-text">0 day streak</span></div>
    </div>
    <div class="gauge-row">
      <div class="gauge-track"><div class="gauge-fill" id="gauge-fill"></div></div>
      <div class="gauge-label"><span id="gauge-count">0 of 0 taken</span><span id="gauge-pct">0%</span></div>
    </div>
  </header>

  <div class="section-title">Today's Shelf</div>
  <div id="today-list"></div>

  <div class="add-bar">
    <button class="add-btn" id="open-add">+ Add a supplement</button>
  </div>

  <div class="section-title">Last 14 Days</div>
  <div class="heatmap glass" id="heatmap"></div>
  <div class="heat-legend">
    <span>less</span>
    <div class="heat-cell" data-level="0"></div>
    <div class="heat-cell" data-level="1"></div>
    <div class="heat-cell" data-level="2"></div>
    <div class="heat-cell" data-level="3"></div>
    <div class="heat-cell" data-level="4"></div>
    <span>full</span>
  </div>

  <footer>Stored privately in this browser only.</footer>
</div>

<!-- Day detail modal -->
<div class="modal-overlay" id="day-modal-overlay">
  <div class="modal">
    <h2 id="day-modal-title">Day detail</h2>
    <div id="day-modal-list"></div>
    <div class="modal-actions">
      <button type="button" class="btn primary" id="day-modal-close" style="flex:1;">Close</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Add a supplement</h2>
    <form id="supp-form">
      <div class="field">
        <label for="f-name">Name</label>
        <input type="text" id="f-name" placeholder="e.g. Vitamin D3" required>
      </div>
      <div class="field">
        <label for="f-dosage">Dosage</label>
        <input type="text" id="f-dosage" placeholder="e.g. 2000 IU">
      </div>
      <div class="field">
        <label for="f-time">Time of day</label>
        <select id="f-time">
          <option value="Morning">Morning</option>
          <option value="Afternoon">Afternoon</option>
          <option value="Evening">Evening</option>
          <option value="Anytime">Anytime</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="delete-btn" style="display:none;">Delete</button>
        <button type="button" class="btn" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const STORE_KEY = 'daily-dose-tracker-v1';
  const TIME_ORDER = ['Morning','Afternoon','Evening','Anytime'];

  function todayStr(d){
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return { supplements: [], logs: {} };
      const parsed = JSON.parse(raw);
      return { supplements: parsed.supplements || [], logs: parsed.logs || {} };
    }catch(e){
      console.error('Failed to load data', e);
      return { supplements: [], logs: {} };
    }
  }

  function saveData(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    }catch(e){
      console.error('Failed to save data', e);
      alert('Could not save — your browser storage may be full or disabled.');
    }
  }

  let data = loadData();
  let editingId = null;

  function uid(){ return 's_' + Math.random().toString(36).slice(2,10); }

  // ---------- Rendering ----------
  function renderDate(){
    const el = document.getElementById('today-date');
    const now = new Date();
    el.textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }

  function currentStreak(){
    // Count consecutive days (ending today) where at least one dose was logged
    // and all supplements that existed at that time... simplified: day counts if
    // every supplement present that day was checked off (and there was >=1 supplement).
    let streak = 0;
    let cursor = new Date();
    while(true){
      const key = todayStr(cursor);
      const log = data.logs[key];
      const suppCount = data.supplements.length;
      if(suppCount === 0) break;
      if(!log) break;
      const takenCount = Object.values(log).filter(Boolean).length;
      if(takenCount < suppCount) break;
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function renderStreak(){
    const s = currentStreak();
    document.getElementById('streak-text').textContent = s + (s === 1 ? ' day streak' : ' day streak');
  }

  function renderGauge(){
    const key = todayStr();
    const log = data.logs[key] || {};
    const total = data.supplements.length;
    const taken = data.supplements.filter(s => log[s.id]).length;
    const pct = total === 0 ? 0 : Math.round((taken/total)*100);
    document.getElementById('gauge-fill').style.width = pct + '%';
    document.getElementById('gauge-count').textContent = taken + ' of ' + total + ' taken';
    document.getElementById('gauge-pct').textContent = pct + '%';
  }

  function renderTodayList(){
    const container = document.getElementById('today-list');
    container.innerHTML = '';
    if(data.supplements.length === 0){
      container.innerHTML = '<div class="empty-state">Your shelf is empty. Add your first supplement below.</div>';
      return;
    }
    const key = todayStr();
    const log = data.logs[key] || {};

    const groups = {};
    TIME_ORDER.forEach(t => groups[t] = []);
    data.supplements.forEach(s => {
      const t = TIME_ORDER.includes(s.time) ? s.time : 'Anytime';
      groups[t].push(s);
    });

    TIME_ORDER.forEach(timeLabel => {
      const items = groups[timeLabel];
      if(items.length === 0) return;
      const groupEl = document.createElement('div');
      groupEl.className = 'time-group';
      const label = document.createElement('div');
      label.className = 'time-group-label';
      label.textContent = timeLabel;
      groupEl.appendChild(label);

      items.forEach(s => {
        const taken = !!log[s.id];
        const card = document.createElement('div');
        card.className = 'supp-card glass' + (taken ? ' taken' : '');

        const toggle = document.createElement('div');
        toggle.className = 'capsule-toggle';
        toggle.innerHTML = '<div class="capsule"></div>';
        toggle.addEventListener('click', () => toggleTaken(s.id));

        const info = document.createElement('div');
        info.className = 'supp-info';
        const name = document.createElement('div');
        name.className = 'supp-name';
        name.textContent = s.name;
        const meta = document.createElement('div');
        meta.className = 'supp-meta';
        meta.textContent = [s.dosage, s.time].filter(Boolean).join(' · ');
        info.appendChild(name);
        info.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'supp-actions';
        const editBtn = document.createElement('button');
        editBtn.className = 'icon-btn';
        editBtn.textContent = '✎';
        editBtn.title = 'Edit';
        editBtn.addEventListener('click', () => openEdit(s.id));
        actions.appendChild(editBtn);

        card.appendChild(toggle);
        card.appendChild(info);
        card.appendChild(actions);
        groupEl.appendChild(card);
      });

      container.appendChild(groupEl);
    });
  }

  function renderHeatmap(){
    const el = document.getElementById('heatmap');
    el.innerHTML = '';
    const total = data.supplements.length;
    const todayKey = todayStr();
    for(let i = 13; i >= 0; i--){
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = todayStr(d);
      const log = data.logs[key] || {};
      const taken = Object.values(log).filter(Boolean).length;
      let level = 0;
      if(total > 0 && taken > 0){
        const ratio = taken / total;
        if(ratio >= 1) level = 4;
        else if(ratio >= 0.66) level = 3;
        else if(ratio >= 0.33) level = 2;
        else level = 1;
      }
      const cell = document.createElement('div');
      cell.className = 'heat-cell' + (key === todayKey ? ' today' : '');
      cell.setAttribute('data-level', level);
      cell.title = d.toLocaleDateString(undefined, {month:'short', day:'numeric'}) + ': ' + taken + '/' + total + ' taken';
      cell.addEventListener('click', () => openDayDetail(key));
      el.appendChild(cell);
    }
  }

  function renderAll(){
    renderDate();
    renderTodayList();
    renderGauge();
    renderStreak();
    renderHeatmap();
  }

  // ---------- Actions ----------
  function toggleTaken(id){
    const key = todayStr();
    if(!data.logs[key]) data.logs[key] = {};
    data.logs[key][id] = !data.logs[key][id];
    saveData();
    renderAll();
  }

  function openAdd(){
    editingId = null;
    document.getElementById('modal-title').textContent = 'Add a supplement';
    document.getElementById('f-name').value = '';
    document.getElementById('f-dosage').value = '';
    document.getElementById('f-time').value = 'Morning';
    document.getElementById('delete-btn').style.display = 'none';
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(() => document.getElementById('f-name').focus(), 50);
  }

  function openEdit(id){
    const s = data.supplements.find(x => x.id === id);
    if(!s) return;
    editingId = id;
    document.getElementById('modal-title').textContent = 'Edit supplement';
    document.getElementById('f-name').value = s.name;
    document.getElementById('f-dosage').value = s.dosage || '';
    document.getElementById('f-time').value = s.time || 'Morning';
    document.getElementById('delete-btn').style.display = 'block';
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal(){
    document.getElementById('modal-overlay').classList.remove('open');
    editingId = null;
  }

  function openDayDetail(key){
    const [y, m, d] = key.split('-').map(Number);
    const dateObj = new Date(y, m - 1, d);
    const todayKey = todayStr();
    document.getElementById('day-modal-title').textContent =
      (key === todayKey ? 'Today — ' : '') +
      dateObj.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });

    const log = data.logs[key] || {};
    const listEl = document.getElementById('day-modal-list');
    listEl.innerHTML = '';

    if(data.supplements.length === 0){
      listEl.innerHTML = '<div class="empty-state">No supplements on your shelf yet.</div>';
    } else {
      data.supplements.forEach(s => {
        const taken = !!log[s.id];
        const row = document.createElement('div');
        row.className = 'day-item ' + (taken ? 'taken' : 'missed');
        row.innerHTML =
          '<div><div class="di-name">' + escapeHtml(s.name) + '</div>' +
          '<span class="di-meta">' + escapeHtml([s.dosage, s.time].filter(Boolean).join(' · ')) + '</span></div>' +
          '<span class="status">' + (taken ? 'Taken' : 'Missed') + '</span>';
        listEl.appendChild(row);
      });
    }

    document.getElementById('day-modal-overlay').classList.add('open');
  }

  function closeDayModal(){
    document.getElementById('day-modal-overlay').classList.remove('open');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function handleSubmit(e){
    e.preventDefault();
    const name = document.getElementById('f-name').value.trim();
    const dosage = document.getElementById('f-dosage').value.trim();
    const time = document.getElementById('f-time').value;
    if(!name) return;

    if(editingId){
      const s = data.supplements.find(x => x.id === editingId);
      if(s){ s.name = name; s.dosage = dosage; s.time = time; }
    } else {
      data.supplements.push({ id: uid(), name, dosage, time });
    }
    saveData();
    closeModal();
    renderAll();
  }

  function handleDelete(){
    if(!editingId) return;
    if(!confirm('Remove this supplement from your shelf? Past log history will be kept.')) return;
    data.supplements = data.supplements.filter(x => x.id !== editingId);
    saveData();
    closeModal();
    renderAll();
  }

  // ---------- Wire up ----------
  document.getElementById('open-add').addEventListener('click', openAdd);
  document.getElementById('cancel-btn').addEventListener('click', closeModal);
  document.getElementById('supp-form').addEventListener('submit', handleSubmit);
  document.getElementById('delete-btn').addEventListener('click', handleDelete);
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if(e.target.id === 'modal-overlay') closeModal();
  });
  document.getElementById('day-modal-close').addEventListener('click', closeDayModal);
  document.getElementById('day-modal-overlay').addEventListener('click', (e) => {
    if(e.target.id === 'day-modal-overlay') closeDayModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){ closeModal(); closeDayModal(); }
  });

  renderAll();
})();
</script>
</body>
</html>
